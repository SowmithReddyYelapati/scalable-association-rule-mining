<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ARM Lab — Scalable Association Rule Mining. Discover meaningful product relationships using Apriori and FP-Growth algorithms."
    >

    <title>
        {% block title %}ARM Lab — Scalable Association Rule Mining{% endblock %}
    </title>

    <!-- Google Fonts: Inter -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}?v=3"
    >

    {% block head %}{% endblock %}

</head>


<body>


<!-- =========================================================
     NAVBAR
     ========================================================= -->

<header class="navbar" id="navbar">

    <!-- Brand -->
    <a href="{{ url_for('dashboard') }}" class="brand" aria-label="ARM Lab Home">

        <span class="brand-icon">🧠</span>

        <span>
            <strong>ARM Lab</strong>
            <small>Association Rule Mining</small>
        </span>

    </a>


    <!-- Nav links -->
    <nav class="nav-links" id="mainNavigation" aria-label="Main Navigation">

        <a
            href="{{ url_for('dashboard') }}"
            {% if request.endpoint in ['dashboard', 'results'] %}class="active" aria-current="page"{% endif %}
        >
            Dashboard
        </a>

        <a
            href="{{ url_for('learn') }}"
            {% if request.endpoint == 'learn' %}class="active" aria-current="page"{% endif %}
        >
            Learn
        </a>

        <a
            href="{{ url_for('benchmarks') }}"
            {% if request.endpoint == 'benchmarks' %}class="active" aria-current="page"{% endif %}
        >
            Benchmarks
        </a>

    </nav>


    <!-- Hamburger (mobile) -->
    <button
        class="hamburger"
        id="menuButton"
        aria-label="Toggle navigation"
        aria-expanded="false"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>

</header>


<!-- =========================================================
     MAIN CONTENT
     ========================================================= -->

<main class="container">

    {% block content %}
    {% endblock %}

</main>


<!-- =========================================================
     FOOTER
     ========================================================= -->

<footer>

    <div>
        <strong>Scalable Association Rule Mining</strong>
        <p style="margin: 2px 0 0; font-size: 11.5px; color: var(--muted);">Research &amp; Engineering Platform for Pattern Discovery</p>
    </div>

    <span>Apriori &middot; FP-Growth &middot; ARM Lab</span>

</footer>


<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script
    src="{{ url_for('static', filename='js/app.js') }}"
></script>


</body>

</html>
